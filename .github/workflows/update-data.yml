   name: Update FPL data

   on:
     schedule:
       - cron: "17 */3 * * *"
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     update:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - run: node scripts/update-data.js
         - run: |
             git config user.name "data-bot"
             git config user.email "data-bot@users.noreply.github.com"
             git add data/players.json
             git diff --cached --quiet || (git commit -m "Update FPL data" && git push)
